services:
  - type: web
    name: system-sync
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: TG_TOKEN
        sync: false
      - key: TG_ID
        sync: false
      - key: HOST_URL
        sync: false
      - key: SPAM_TEXT
        sync: false
